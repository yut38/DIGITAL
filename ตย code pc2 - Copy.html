    <script>
        jwplayer.key = 'XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo';

function playVideo(url, type) {
    const playerContainer = document.getElementById('player-container');
    playerContainer.style.display = 'block';

    // เคลียร์ตัวเล่นก่อน แต่คง div ไว้เพื่อใช้กับ JW Player
    playerContainer.innerHTML = '<button id="close-btn" onclick="closePlayer()">❌</button><div id="player"></div>';

    if (type === "hls") {
        jwplayer("player").setup({
            file: url ,
            type: "hls",
            width: "100%",
            aspectratio: "16:9",
            autostart: true
        });

    } else if (type === "dash") {
        let videoElement = document.createElement("video");
        videoElement.id = "dash-player";
        videoElement.controls = true;
        videoElement.style.width = "100%";
        playerContainer.appendChild(videoElement);

        var player = dashjs.MediaPlayer().create();
        player.initialize(videoElement, url, true);
    }
}

function closePlayer() {
    const playerContainer = document.getElementById('player-container');
    playerContainer.style.display = 'none';

    if (jwplayer("player")) {
        jwplayer("player").stop();
    }

    const dashPlayer = document.getElementById("dash-player");
    if (dashPlayer) {
        dashPlayer.pause();
        dashPlayer.remove();
    }

    history.back();


 }

       // ตรวจจับตำแหน่งเมาส์เพื่อแสดงเมนูช่อง แม้อยู่ในโหมด fullscreen
        document.addEventListener("mousemove", function(event) {
            const menu = document.getElementById("channel-menu");
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;

            // ถ้าเมาส์อยู่ใกล้ขอบซ้าย (< 50px) ให้แสดงเมนู
            if (event.clientX < 50) {
                menu.classList.add("active");
            } else {
                menu.classList.remove("active");
            }
        });

    </script>
